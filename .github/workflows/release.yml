name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
        with:
          deno-version: 2.9.2
      - name: Validate tag, version, and main ancestry
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be stable SemVer in the form vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          deno task release:verify "$VERSION"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The releases/tags endpoint never returns drafts and prints a JSON
          # error body on 404, so search the release list instead.
          find_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\")" | jq -cs 'first // empty'
          }
          RELEASE="$(find_release)"
          if [[ -n "$RELEASE" ]]; then
            if [[ "$(jq -r .draft <<< "$RELEASE")" != "true" ]]; then
              echo "Refusing to modify an already-published release" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "Veilfeed $TAG"
            RELEASE="$(find_release)"
          fi
          RELEASE_ID="$(jq -r .id <<< "$RELEASE")"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      # Developer ID signing and notarization run only once the release
      # environment has Apple secrets; otherwise the DMGs are ad-hoc signed.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            expected-arch: arm64
            label: apple-silicon
          - target: x86_64-apple-darwin
            expected-arch: x86_64
            label: intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
        with:
          deno-version: 2.9.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: .
          key: ${{ matrix.target }}
      - run: deno install --frozen
      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/veilfeed-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/veilfeed-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Prepare notarization credentials
        if: env.SIGNED == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          {
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}"
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}"
          } >> "$GITHUB_ENV"
      - name: Build and upload DMG
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VEILFEED_RELEASE_REPOSITORY: ${{ github.repository }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false
          tauriScript: deno task tauri
          args: --bundles dmg --target ${{ matrix.target }} -- --locked
      - name: Verify application and DMG
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.expected-arch }}
        run: |
          BUNDLE_ROOT="target/$TARGET/release/bundle"
          APP_PATH="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" && test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          if [[ "$SIGNED" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            xcrun stapler validate "$DMG_PATH"
          fi
          EXECUTABLE="$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 -print -quit)"
          lipo -verify_arch "$EXPECTED_ARCH" "$EXECUTABLE"
          MOUNT_PATH="$RUNNER_TEMP/veilfeed-${{ matrix.label }}"
          mkdir -p "$MOUNT_PATH"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_PATH" "$DMG_PATH"
          trap 'hdiutil detach "$MOUNT_PATH"' EXIT
          MOUNTED_APP="$(find "$MOUNT_PATH" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"
          if [[ "$SIGNED" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$MOUNTED_APP"
          fi
          if [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]; then
            MOUNTED_EXECUTABLE="$(find "$MOUNTED_APP/Contents/MacOS" -type f -perm +111 -print -quit)"
            "$MOUNTED_EXECUTABLE" > "$RUNNER_TEMP/veilfeed-smoke.log" 2>&1 &
            APP_PID=$!
            sleep 5
            kill -0 "$APP_PID"
            kill "$APP_PID"
            wait "$APP_PID" || true
          fi
      - name: Retain application bundle for diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Veilfeed-${{ needs.prepare.outputs.version }}-${{ matrix.label }}-app
          path: target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/veilfeed-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/veilfeed-release.p12" "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"

  checksums:
    needs: [prepare, build]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download draft DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir dmgs
      - name: Verify architecture assets and generate checksums
        run: |
          test "$(find dmgs -name '*.dmg' | wc -l | tr -d ' ')" = "2"
          find dmgs -name '*.dmg' -exec basename {} \; | grep -Eq 'aarch64|arm64'
          find dmgs -name '*.dmg' -exec basename {} \; | grep -Eq 'x64|x86_64'
          cd dmgs
          shasum -a 256 *.dmg > SHA256SUMS
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dmgs/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
