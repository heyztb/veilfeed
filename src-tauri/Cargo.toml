[package]
name = "veilfeed"
version.workspace = true
description = "A private, proxy-aware desktop feed reader"
authors = ["Veilfeed contributors"]
edition = "2024"

[lib]
name = "veilfeed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
veilfeed-core = { path = "../crates/veilfeed-core" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

